name: UII staging runtime verification

on:
  # Run when this verification gate is introduced or changed on the UII
  # canonical feature branch. The checks are read-only.
  push:
    branches:
      - feat/guided-dschool-learning-path-20261121
    paths:
      - .github/workflows/uii-staging-runtime-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uii-staging-runtime-smoke
  cancel-in-progress: false

jobs:
  api-readiness-and-auth-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # This is an infrastructure hostname, not a user-facing brand label.
      STAGING_API_ORIGIN: https://usi-design-thinking-api-staging.onrender.com
      STAGING_FRONTEND_ORIGIN: https://uii-design-thinking-hub-staging.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify UII staging API, database readiness, Q&A 401, and CORS
        run: node scripts/staging-api-smoke.mjs
