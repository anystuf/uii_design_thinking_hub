name: MVP Releases A–C checks

on:
  pull_request:
    branches: [main, 'feat/mvp-release-a-learning-foundation-20261105', 'feat/mvp-release-b-design-studio-20261105']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          NEXT_PUBLIC_API_URL: http://localhost:4000

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studio_test
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studio_test
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studio_test
      - run: npm run prisma:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studio_test
      - run: npm test
        env:
          RUN_DB_INTEGRATION: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studio_test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studio_test
